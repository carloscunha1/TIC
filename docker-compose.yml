services:
  db:
    image: postgres:16-alpine
    container_name: tic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tic}
      POSTGRES_USER: ${POSTGRES_USER:-tic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tic_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tic} -d ${POSTGRES_DB:-tic}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tic-postgres-data:
